# Три сервиса. Порядок важен только для переменных: адреса api и rules
# Render подставляет сам через fromService, руками вписывать ничего не нужно.
services:
  # Python-правила: срочность, разбор длительности, сводка по очереди.
  - type: web
    name: triage-rules
    runtime: python
    plan: free
    rootDir: rules
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # Без этого Render берёт свежайший Python, под который у pydantic-core
      # ещё нет колеса, и сборка уходит компилировать Rust — и падает.
      - key: PYTHON_VERSION
        value: "3.12.8"

  # Node-API: диалог, сборка карточки, очередь.
  - type: web
    name: triage-api
    runtime: node
    plan: free
    rootDir: api
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DEMO_MODE
        value: "1"
      # Публичный адрес, а не fromService: на бесплатном плане Render
      # внутренняя сеть между сервисами не работает, и внутренний адрес
      # «triage-rules:10000» даёт fetch failed. При первом развёртывании
      # Render добавляет к именам случайный суффикс — подставьте свои.
      - key: RULES_URL
        value: https://triage-rules.onrender.com
      - key: RULES_TIMEOUT_MS
        value: "4000"

  # Next.js: лендинг, опрос, экран врача. Публичная ссылка — этот сервис.
  - type: web
    name: triage-web
    runtime: node
    plan: free
    rootDir: web
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      # Тот же случай: публичный адрес вместо внутреннего.
      - key: API_URL
        value: https://triage-api-7tcb.onrender.com
