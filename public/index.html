<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Предварительный опрос пациента</title>
<style>
  :root { color-scheme: light dark; --bg:#fff; --fg:#111; --muted:#666; --line:#ddd; --me:#e8f0fe; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14161a; --fg:#eee; --muted:#9aa; --line:#333; --me:#1e2a3d; } }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg);
         font:16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  main { max-width:640px; margin:0 auto; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:14px; margin-bottom:16px; }
  #log { display:flex; flex-direction:column; gap:10px; margin-bottom:16px; }
  .msg { padding:10px 12px; border:1px solid var(--line); border-radius:12px; white-space:pre-wrap; }
  .bot { background:transparent; }
  .me { background:var(--me); align-self:flex-end; max-width:85%; }
  form { display:flex; gap:8px; position:sticky; bottom:0; background:var(--bg); padding:8px 0; }
  input, button { font:inherit; padding:12px; border-radius:10px; border:1px solid var(--line); }
  input { flex:1; min-width:0; background:var(--bg); color:var(--fg); }
  button { background:#2563eb; color:#fff; border-color:#2563eb; cursor:pointer; }
  button[disabled] { opacity:.5; cursor:default; }
  .banner { background:#b91c1c; color:#fff; padding:14px; border-radius:12px; font-weight:600; margin-bottom:12px; }
  .banner a { color:#fff; }
  table { width:100%; border-collapse:collapse; margin-top:8px; }
  td { padding:6px 4px; border-bottom:1px solid var(--line); vertical-align:top; }
  td:first-child { color:var(--muted); width:42%; }
  .progress { font-size:13px; color:var(--muted); }
  footer { margin-top:24px; font-size:13px; color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Предварительный опрос</h1>
  <p class="sub">Это не диагноз. Ответьте на 7 вопросов — врач получит структурированную карточку.
    <span id="demo"></span></p>
  <div id="result"></div>
  <div id="log"></div>
  <form id="form">
    <input id="input" autocomplete="off" placeholder="Ваш ответ" required>
    <button id="send">Ответить</button>
  </form>
  <p class="progress" id="progress"></p>
  <footer><a href="/doctor.html">Экран врача →</a></footer>
</main>
<script>
const log = document.getElementById('log');
const form = document.getElementById('form');
const input = document.getElementById('input');
const send = document.getElementById('send');
const progress = document.getElementById('progress');
const result = document.getElementById('result');
let sessionId = null;

function bubble(text, who) {
  const div = document.createElement('div');
  div.className = 'msg ' + who;
  div.textContent = text;
  log.appendChild(div);
  div.scrollIntoView({ block: 'nearest' });
}

function ask(q) {
  bubble(q.text, 'bot');
  progress.textContent = `Вопрос ${q.index} из ${q.total}`;
}

async function post(url, body) {
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify(body),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Ошибка сервера');
  return data;
}

async function start() {
  const data = await post('/api/session', {});
  sessionId = data.sessionId;
  document.getElementById('demo').textContent = data.demoMode ? 'Режим демонстрации.' : '';
  ask(data.question);
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  bubble(text, 'me');
  input.value = '';
  send.disabled = true;
  try {
    const data = await post('/api/answer', { sessionId, text });
    if (data.done) showCard(data.card); else { ask(data.question); send.disabled = false; input.focus(); }
  } catch (err) {
    bubble('Ошибка: ' + err.message, 'bot');
    send.disabled = false;
  }
});

function row(label, value) {
  return `<tr><td>${label}</td><td>${value ? String(value).replace(/</g, '&lt;') : '—'}</td></tr>`;
}

function showCard(card) {
  form.style.display = 'none';
  progress.textContent = 'Опрос завершён.';
  const banner = card.urgency.code === 'emergency'
    ? `<div class="banner">Неотложное состояние. Звоните <a href="tel:103">103</a> (со стационарного — 03).
       Не садитесь за руль, не ждите планового приёма.</div>` : '';
  result.innerHTML = banner + `
    <h1>Карточка для врача</h1>
    <table>
      ${row('Срочность', card.urgency.label)}
      ${row('Основание', card.reason)}
      ${row('Тревожные признаки', card.redFlags.length ? card.redFlags.join(', ') : 'не выявлены')}
      ${row('Жалобы', card.complaints)}
      ${row('Длительность', card.duration)}
      ${row('Боль (0–10)', card.painLevel)}
      ${row('Аллергии', card.allergies)}
      ${row('Хронические заболевания', card.chronic)}
      ${row('Препараты', card.meds)}
      ${row('Черновик записи', card.draft)}
    </table>`;
  result.scrollIntoView({ block: 'start' });
}

start().catch((err) => bubble('Не удалось начать опрос: ' + err.message, 'bot'));
</script>
</body>
</html>
